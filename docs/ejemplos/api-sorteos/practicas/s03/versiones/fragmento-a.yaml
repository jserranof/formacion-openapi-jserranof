info:
  title: Resultados
  version: 2.0.0
paths:
  /resultados/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: El resultado
          content:
            application/json:
              schema:
                type: object
                properties:
                  complementario:
                    type: [integer, "null"]
webhooks:
  resultadoPublicado:
    post:
      responses:
        "200": { description: Recibido }
