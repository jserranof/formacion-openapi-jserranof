openapi: 3.1.0
info:
  title: API base del curso
  version: 1.0.0
  description: Plantilla de partida. El recurso «tareas» se sustituye por el del caso práctico.
servers:
  - url: http://localhost:3000
paths:
  /salud:
    get:
      summary: Comprueba que la API está viva
      responses:
        "200":
          description: La API responde
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado: { type: string, example: ok }
  /tareas:
    get:
      summary: Lista las tareas
      responses:
        "200":
          description: Todas las tareas
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Tarea" }
    post:
      summary: Crea una tarea
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TareaNueva" }
      responses:
        "201":
          description: Tarea creada
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tarea" }
        "400": { $ref: "#/components/responses/Problema" }
  /tareas/{id}:
    get:
      summary: Obtiene una tarea
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: La tarea
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tarea" }
        "404": { $ref: "#/components/responses/Problema" }
components:
  schemas:
    Tarea:
      type: object
      required: [id, titulo, completada, creadaEn]
      properties:
        id: { type: integer, example: 1 }
        titulo: { type: string, example: Arrancar la API }
        completada: { type: boolean }
        creadaEn: { type: string, format: date-time }
    TareaNueva:
      type: object
      required: [titulo]
      properties:
        titulo: { type: string, minLength: 1 }
    Problema:
      type: object
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
  responses:
    Problema:
      description: Error con formato problem+json (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
